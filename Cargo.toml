[package]
name = "simplenote-cli"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
default-run = "simplenote"
description = "A scriptable Simplenote CLI for humans and agents"
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/rvben/simplenote-cli"
homepage = "https://github.com/rvben/simplenote-cli"
keywords = ["cli"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = ["PRODUCT.md", "DESIGN.md", ".impeccable/**"]

[lib]
name = "simplenote_cli"
path = "src/lib.rs"

[[bin]]
name = "simplenote-cli"
path = "src/main.rs"

[[bin]]
name = "simplenote"
path = "src/bin/simplenote.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Keep public roots available while also trusting enterprise/system CAs.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots", "system-proxy", "socks"] }
dirs = "6"
tempfile = "3"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
sha2 = "0.10"
shell-words = "1.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mockito = "1"
jsonschema = { version = "0.46", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
