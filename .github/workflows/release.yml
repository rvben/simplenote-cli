name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
      skip_pypi:
        description: Skip an already published PyPI package when recovering a workflow
        type: boolean
        default: false
      skip_crates_io:
        description: Skip an already published crate when recovering a workflow
        type: boolean
        default: false
      skip_github_release:
        description: Skip an already published GitHub release when recovering a workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Check tag and package version
        id: metadata
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == 'push' || "$DRY_RUN" != 'true' ]]; then
            test "$GITHUB_REF_TYPE" = 'tag'
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make check
      - run: make package-check
      - run: cargo publish --dry-run --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            maturin_args: --compatibility manylinux_2_28 --zig
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            maturin_args: --compatibility manylinux_2_28 --zig
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Build native binary wheel
        run: uvx --from 'maturin>=1.8,<2' --with ziglang maturin build --locked --release --target ${{ matrix.target }} ${{ matrix.maturin_args }} --out dist/wheels
      - name: Validate wheel metadata
        run: uvx --from twine==6.2.0 twine check --strict dist/wheels/*.whl
      - name: Install and smoke test wheel
        if: ${{ !matrix.cross }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke" --no-index dist/wheels/*.whl
          venv_bin="$RUNNER_TEMP/wheel-smoke/bin"
          test -d "$venv_bin" || venv_bin="$RUNNER_TEMP/wheel-smoke/Scripts"
          for command in simplenote simplenote-cli; do
            python scripts/smoke-release.py "$venv_bin/$command${{ matrix.extension }}" "$VERSION"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/wheels/*.whl
          if-no-files-found: error
      - name: Smoke test binary
        if: ${{ !matrix.cross }}
        run: |
          for command in simplenote simplenote-cli; do
            ./target/${{ matrix.target }}/release/$command${{ matrix.extension }} --version
          done
      - name: Package binary and checksum
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir package
          for command in simplenote simplenote-cli; do
            cp "target/$TARGET/release/$command${{ matrix.extension }}" package/
          done
          cp LICENSE README.md package/
          archive="simplenote-cli-v$VERSION-$TARGET.tar.gz"
          tar -czf "$archive" -C package .
          python - "$archive" <<'PYTHON'
          import hashlib, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          pathlib.Path(str(archive) + '.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: simplenote-cli-*.tar.gz*
          if-no-files-found: error

  sdist:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - run: uvx --from 'maturin>=1.8,<2' maturin sdist --out dist/sdist
      - run: uvx --from twine==6.2.0 twine check --strict dist/sdist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/sdist/*.tar.gz
          if-no-files-found: error

  pypi:
    needs: [check, build, sdist]
    if: ${{ inputs.dry_run != true && inputs.skip_pypi != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/simplenote-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          skip-existing: true

  verify-pypi:
    needs: [check, pypi]
    if: ${{ inputs.dry_run != true && inputs.skip_pypi != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Install the public wheel and verify its CLI
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          uv venv "$RUNNER_TEMP/pypi-smoke"
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python "$RUNNER_TEMP/pypi-smoke" --refresh --only-binary :all: --index-url https://pypi.org/simple "simplenote-cli==$VERSION"; then
              break
            fi
            test "$attempt" -lt 6 || exit 1
            sleep 10
          done
          for command in simplenote simplenote-cli; do
            python scripts/smoke-release.py "$RUNNER_TEMP/pypi-smoke/bin/$command" "$VERSION"
          done

  crates:
    needs: [check, build, sdist]
    if: ${{ inputs.dry_run != true && inputs.skip_crates_io != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Authenticate with Trusted Publishing after the initial crate exists
        id: auth
        if: env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_TOKEN || steps.auth.outputs.token }}

  github-release:
    needs: [check, build, sdist]
    if: ${{ inputs.dry_run != true && inputs.skip_github_release != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
